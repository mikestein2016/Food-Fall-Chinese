name: Deploy to GitHub Pages

# Builds the Vite + Phaser app and publishes the static dist/ to the gh-pages
# branch, which GitHub Pages serves. No Pages "source" setting change needed:
# this replaces the served index.html (the old Construct export) with the new
# build. The original export remains on the development branch and in history.
on:
  push:
    branches: [claude/construct-phaser-migration-531ffj]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" # browsers only needed for the harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
